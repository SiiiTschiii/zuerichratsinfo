name: Validate Contacts

on:
  push:
    paths:
      - "data/contacts.yaml"
      - "cmd/validate_contacts/**"
      - "cmd/platform_stats/**"
      - "README.md"
      - ".github/workflows/validate-contacts.yml"
  pull_request:
    paths:
      - "data/contacts.yaml"
      - "cmd/validate_contacts/**"
      - "cmd/platform_stats/**"
      - "README.md"
      - ".github/workflows/validate-contacts.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"

      - name: Download dependencies
        run: go mod download

      - name: Validate contacts.yaml
        run: go run cmd/validate_contacts/main.go data/contacts.yaml

      # The generator rewrites README.md in place, so running it and diffing
      # tells us whether the committed stats still match data/contacts.yaml.
      # This used to push the regenerated README straight to main, which the
      # branch ruleset now blocks — so report it and let the dev commit it.
      - name: Check platform statistics are up to date
        run: |
          go run cmd/platform_stats/main.go

          if git diff --quiet -- README.md; then
            echo "README.md platform statistics are up to date."
            exit 0
          fi

          echo "::error file=README.md::Platform statistics in README.md are out of date with data/contacts.yaml."
          cat <<'MSG'

          The platform statistics table in README.md no longer matches
          data/contacts.yaml. Regenerate it and commit the result:

              go run cmd/platform_stats/main.go
              git add README.md
              git commit -m "Update platform statistics in README"

          Required changes:
          MSG
          git --no-pager diff -- README.md
          exit 1
