name: Zurich Ratsinfo Bot

on:
  schedule:
    - cron: "36 * * * *"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

  # Optional: Also run on push to main for testing
  # push:
  #   branches: [ main ]

jobs:
  post-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Isolated branch that holds the mutable state log (posted votes).
      # Keeping it off `main` lets this Action update state without tripping
      # the pull request ruleset / branch protection on the primary branch.
      STATE_BRANCH: state-log
      # Vote logs live at data/<jurisdiction>/posted_votes_<platform>.json.
      # Globbing both layouts means adding a jurisdiction needs no edit here,
      # and a run during the migration still finds the pre-jurisdiction files.
      STATE_GLOB_NESTED: "data/*/posted_votes_*.json"
      STATE_GLOB_LEGACY: "data/posted_votes_*.json"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore vote log from state branch
        id: restore
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # '$STATE_BRANCH' holds the only copy of the vote log, so every failure
          # below is fatal: votelog.Load treats a missing log file as an *empty*
          # log with no error, which reads as "nothing was ever posted" and would
          # re-post everything inside MAX_VOTE_AGE_DAYS.
          if ! state_ref="$(git ls-remote --heads origin "$STATE_BRANCH")"; then
            echo "::error::Cannot reach origin to look up '$STATE_BRANCH'."
            exit 1
          fi

          if [ -z "$state_ref" ]; then
            echo "::error::State branch '$STATE_BRANCH' does not exist. It holds the only copy of the vote log; running without it would re-post already-published votes. Recreate it from a known-good log before running again."
            exit 1
          fi

          echo "State branch '$STATE_BRANCH' found; restoring vote logs from it."
          git fetch origin "$STATE_BRANCH"

          # Either layout may be present, so a missing match is not itself an
          # error — but ending up with no logs at all is.
          git checkout FETCH_HEAD -- "$STATE_GLOB_NESTED" || true
          git checkout FETCH_HEAD -- "$STATE_GLOB_LEGACY" || true

          restored="$(find data -name 'posted_votes_*.json' 2>/dev/null | sort)"
          if [ -z "$restored" ]; then
            echo "::error::'$STATE_BRANCH' contains no vote logs matching $STATE_GLOB_NESTED or $STATE_GLOB_LEGACY."
            exit 1
          fi
          echo "Restored:"
          echo "$restored"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"

      - name: Download dependencies
        run: go mod download

      - name: Run bot
        env:
          # Platform credentials and limits are scoped to a channel — one set
          # of accounts serving one or more jurisdictions. The prefix is the
          # channel key, so a second channel is purely additive.
          ZURICH_X_API_KEY: ${{ secrets.ZURICH_X_API_KEY }}
          ZURICH_X_API_SECRET: ${{ secrets.ZURICH_X_API_SECRET }}
          ZURICH_X_ACCESS_TOKEN: ${{ secrets.ZURICH_X_ACCESS_TOKEN }}
          ZURICH_X_ACCESS_SECRET: ${{ secrets.ZURICH_X_ACCESS_SECRET }}
          ZURICH_BLUESKY_HANDLE: ${{ vars.ZURICH_BLUESKY_HANDLE }}
          ZURICH_BLUESKY_PASSWORD: ${{ secrets.ZURICH_BLUESKY_PASSWORD }}
          ZURICH_IG_USER_ID: ${{ secrets.ZURICH_IG_USER_ID }}
          ZURICH_IG_ACCESS_TOKEN: ${{ secrets.ZURICH_IG_ACCESS_TOKEN }}
          ZURICH_GITHUB_TOKEN: ${{ github.token }}
          ZURICH_IG_REPO_OWNER: SiiiTschiii
          ZURICH_IG_REPO_NAME: zuerichratsinfo
          ZURICH_X_MAX_POSTS_PER_RUN: ${{ vars.ZURICH_X_MAX_POSTS_PER_RUN }}
          ZURICH_X_MAX_CHARS: ${{ vars.ZURICH_X_MAX_CHARS }}
          ZURICH_BLUESKY_MAX_POSTS_PER_RUN: ${{ vars.ZURICH_BLUESKY_MAX_POSTS_PER_RUN }}
          ZURICH_IG_MAX_POSTS_PER_RUN: ${{ vars.ZURICH_IG_MAX_POSTS_PER_RUN }}

          MAX_VOTES_TO_CHECK: ${{ vars.MAX_VOTES_TO_CHECK }}
          MAX_VOTE_AGE_DAYS_ZURICH_CITY: ${{ vars.MAX_VOTE_AGE_DAYS_ZURICH_CITY }}
          MAX_VOTE_AGE_DAYS_ZURICH_CANTON: ${{ vars.MAX_VOTE_AGE_DAYS_ZURICH_CANTON }}
          JURISDICTION_ZURICH_CANTON_ENABLED: ${{ vars.JURISDICTION_ZURICH_CANTON_ENABLED }}
        run: go run main.go

      # Runs even when the bot itself fails, so a partial run still records what
      # it posted — but not when the restore failed, since the logs on disk would
      # then be missing or stale rather than the real state.
      - name: Commit updated vote log to state branch
        if: always() && steps.restore.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Update the state log on the isolated STATE_BRANCH using a dedicated
          # worktree, so nothing is ever committed to the protected primary branch.
          # The restore step guarantees the branch exists and is fetched.
          worktree="$(mktemp -d)"
          git worktree add -B "$STATE_BRANCH" "$worktree" "origin/$STATE_BRANCH"

          # --parents preserves data/<jurisdiction>/, without which two
          # jurisdictions' logs would overwrite each other in the state branch
          # and votes would look unposted on the next run.
          mapfile -t state_files < <(find data -name 'posted_votes_*.json' | sort)
          cp --parents "${state_files[@]}" "$worktree/"

          # Once a jurisdiction's log exists at the nested path, drop the flat
          # one it was migrated from so the state branch has a single copy.
          for nested in "${state_files[@]}"; do
            case "$nested" in
              data/*/posted_votes_*.json)
                legacy="data/$(basename "$nested")"
                if [ -e "$worktree/$legacy" ]; then
                  echo "Migrated $legacy -> $nested; removing the flat copy."
                  git -C "$worktree" rm --quiet -- "$legacy"
                fi
                ;;
            esac
          done

          git -C "$worktree" add -- data
          if git -C "$worktree" diff --staged --quiet; then
            echo "No vote log changes to commit."
          else
            git -C "$worktree" commit -m "Update posted votes log [skip ci]"
            git -C "$worktree" push origin "$STATE_BRANCH"
          fi

          git worktree remove --force "$worktree"
