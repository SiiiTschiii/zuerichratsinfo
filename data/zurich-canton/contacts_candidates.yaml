# UNVERIFIED CANDIDATES — nothing here is a confirmed account.
#
# Harvested 2026-09-02 by searching each of the 180 sitting Kantonsrat members
# by name, party and chamber, restricted to the six platform domains. Every entry
# below is a search result: a handle that belongs to someone else would put a real
# person's account next to a vote they did not cast, which is the one failure the
# curated mapping exists to prevent.
#
# `confidence` is how well the result's own page title matched the person, and
# nothing more. It is not evidence of identity:
#   high   - full name in the title, usually with the office or party beside it
#   medium - surname matched, or the URL slug matched but the title said little
#   low    - the slug looks right and nothing else does
#
# This file is committed so the drafts can be reviewed in the pull request. It is
# inert: no tool reads it. contacts.yaml is the only file the tagger loads, so a
# handle starts affecting posts when a human moves it there — never before.

