# Social media handles for members of the Kantonsrat Zürich.
#
# The 180 names are seeded from the parliament's own roster and refreshed with:
#
#     go run ./cmd/update_contacts -jurisdiction zurich-canton
#
# The handles are not, and cannot be: OpenParlData publishes no social media
# fields, so every account here has to be confirmed by a human.
#
# Entries carrying `verified: false` are candidates from a name search, not
# accounts. Nothing posts them — the tagger reads verified handles only — so they
# sit here safely while the list is worked through. To confirm one: open it, check
# it is the person named above it, then set `verified: true` and delete the
# `confidence` line. `confidence` says how well the search result's own page title
# matched the name and nothing more; it is an ordering aid, never evidence.
#
# Getting one wrong puts a real person's handle next to a vote they did not cast,
# which is the failure this whole mapping exists to prevent. A member with no
# verified handle is fine: the post names them without tagging them.
#
# Work through them with the search links, which show the candidates inline:
#
#     go run ./cmd/generate_search_urls -jurisdiction zurich-canton
