# Social media handles for members of the Kantonsrat Zürich.
#
# The 180 names are seeded from the parliament's own roster and refreshed with:
#
#     go run ./cmd/update_contacts -jurisdiction zurich-canton
#
# The handles are not, and cannot be: OpenParlData publishes no social media
# fields, so every account here was found and verified by a human. Partial and
# correct beats complete and guessed — tagging the wrong account puts a real
# person's handle next to a vote they did not cast. An entry with no handles is
# valid and does exactly what it should: the post names that member without
# tagging them.
#
# Party and Fraktion are deliberately absent. The parliament publishes both, so
# a copy here could only go stale; run cmd/generate_search_urls, which reads
# them live, when you need them for curation.
