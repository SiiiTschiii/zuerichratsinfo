# Test contacts for e2e fixture posting.
# Maps politician names used in test fixtures to fake/test handles
# so real accounts are never tagged during testing.
#
# Replace the handles below with your actual test account handles
# to verify that tagging works end-to-end.
#
# Facebook mentions are written with a numeric ID, so a Facebook URL here has to
# carry one: profile.php?id=<id>, or facebook.com/<id> for a Page. The people
# below stand in for a Page the maintainer administers (CHparlinfo) and the
# parties for another (House of Jass), so a test post notifies nobody else. To
# test mentioning a person, put your own profile.php?id=<id> on one of them.
